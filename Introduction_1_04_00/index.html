<div class="profile-card">
    <img src="vkk.jpg" alt="Virat Kohli"> 
    <h1>NAME : VIRAT KOHLI</h1>
    <h2>OCCUPATION: RIGHT HAND BATSMAN</h2>
    <p>Bio : One of the greatest Cricketers Alive.</p>
    
    <h3>Played For -</h3>
    <ol>
        <li>India</li>
        <li>RCB</li>
        <li>Delhi</li>
    </ol>
    
    <div class="fanclub-form">
        <input type="email" placeholder="Enter Email"> 
        <button class="join">Join FanClub</button>
    </div>

    <div>
        <button class="following">Follow</button>
    </div>

</div>


    </body>

    <script>
        const emailInput = document.querySelector('.fanclub-form input');
        const joinButton = document.querySelector('.fanclub-form button');
        const profileCard = document.querySelector('.profile-card');

        const messageDisplay = document.createElement('p');
        messageDisplay.style.fontSize = '0.85rem';
        messageDisplay.style.marginTop = '15px';
        messageDisplay.style.fontWeight = 'bold';
        profileCard.appendChild(messageDisplay);

        joinButton.addEventListener('click', function() {
            const emailValue = emailInput.value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailValue === '') {
                messageDisplay.style.color = '#d32f2f';
                messageDisplay.textContent = 'Please enter an email address!';
            } else if (!emailPattern.test(emailValue)) {
                messageDisplay.style.color = '#d32f2f';
                messageDisplay.textContent = 'Please enter a valid email format (e.g., name@email.com).';
            } else {
                messageDisplay.style.color = '#2e7d32';
                messageDisplay.textContent = `Success! Added ${emailValue} to the FanClub.`;

                emailInput.value = '';

                setTimeout(() => {
                    messageDisplay.textContent = '';
                }, 4000);
            }
        });
    </script>
